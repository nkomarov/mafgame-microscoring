<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Наблюдатель — микроскоринг</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark;--accent:#2379b8}*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--tg-theme-bg-color,#f5f6fa);color:var(--tg-theme-text-color,#1b2630)}main{max-width:550px;margin:auto}h1{font-size:19px;margin:0 0 6px}small{opacity:.7}.layout{display:grid;grid-template-columns:minmax(110px,28%) 1fr;gap:14px;margin-top:14px}.seats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:6px;align-self:start}.seat{aspect-ratio:1;border:1px solid #9aa6b2;border-radius:9px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit;font-size:20px;font-weight:700;min-width:0;cursor:pointer}.seat.selected{background:var(--accent);color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}.action{border:1px solid #b5bfca;border-radius:9px;padding:11px 4px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit;font-size:13px;cursor:pointer}.action.selected{border:2px solid var(--accent);font-weight:700}.full{grid-column:1/-1}textarea{width:100%;min-height:82px;border-radius:9px;padding:10px;font:inherit;margin-top:8px}button.primary{background:var(--tg-theme-button-color,#2379b8);color:var(--tg-theme-button-text-color,#fff);border:0;border-radius:10px;padding:12px;font-weight:700;width:100%;margin-top:10px}.log{margin-top:12px;font-size:13px;max-height:170px;overflow:auto}.notice{padding:9px;border-radius:8px;background:var(--tg-theme-secondary-bg-color,#e8edf3);margin-top:12px} .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:8px}select{max-width:100%}@media(max-width:330px){.layout{grid-template-columns:30% 1fr;gap:8px}.action{font-size:12px;padding:8px 2px}}
</style></head><body><main>
<h1>Микроскоринг · наблюдатель</h1><small>Прототип интерфейса · данные пока не отправляются на сервер</small>
<div class="meta"><span>Партия: <strong id="game">DEMO</strong></span><label>Фаза <select id="phase"><option>День 1</option><option>Ночь 1</option><option>День 2</option><option>Ночь 2</option><option>День 3</option></select></label></div>
<div class="layout"><div class="seats" id="seats" aria-label="Игроки по часовой стрелке"></div>
<div class="actions" id="actions">
<button class="action" data-kind="nomination">Выставил</button><button class="action" data-kind="vote">Голос</button>
<button class="action" data-kind="will">Завещание</button><button class="action" data-kind="first_speech">Речь +1</button>
<button class="action" data-kind="split_organized">Автопопил</button><button class="action" data-kind="split_broken">Слом попила</button>
<button class="action" data-kind="split_saved">Спас попил</button><button class="action" data-kind="elimination">Выбыл</button>
<button class="action" data-kind="night_kill">Ночное убийство</button><button class="action" data-kind="check">Проверка</button>
<button class="action full" data-kind="note">Другое / заметка</button></div></div>
<div class="notice" id="status" role="status">Выбери действие, затем игрока-автора и цель (если требуется).</div>
<label for="note"><strong>Что ещё произошло?</strong></label><textarea id="note" maxlength="2000" placeholder="Свободное наблюдение: что, когда, с кем произошло…"></textarea>
<button class="primary" id="save">Сохранить наблюдение</button><div class="log" id="log"></div>
</main><script>
const app=window.Telegram?.WebApp;app?.ready();app?.expand();
const seats=document.getElementById('seats'),status=document.getElementById('status'),log=document.getElementById('log');let kind=null,actor=null,targets=[];
const targetCounts={nomination:1,vote:1,will:3,check:1,split_broken:0,split_saved:0,split_organized:0,first_speech:0,elimination:0,night_kill:0,note:0};
for(let n=1;n<=10;n++){const b=document.createElement('button');b.className='seat';b.textContent=n;b.dataset.seat=n;b.style.gridColumn=n<=5?1:2;b.style.gridRow=n<=5?6-n:n-5;b.onclick=()=>{if(!kind){status.textContent='Сначала выбери действие';return}if(actor===null){actor=n}else if((targetCounts[kind]??0)>targets.length && n!==actor&&!targets.includes(n)){targets.push(n)}else{status.textContent='Цель уже выбрана или не требуется';return}render()};seats.append(b)}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;actor=null;targets=[];render()});
function render(){document.querySelectorAll('.action').forEach(b=>b.classList.toggle('selected',b.dataset.kind===kind));document.querySelectorAll('.seat').forEach(b=>b.classList.toggle('selected',Number(b.dataset.seat)===actor||targets.includes(Number(b.dataset.seat))));const required=targetCounts[kind]??0;status.textContent=!kind?'Выбери действие':actor===null?'Выбери игрока-автора':targets.length<required?'Выбери цель '+(targets.length+1)+' из '+required:'Готово: '+kind+' · игрок '+actor+(targets.length?' → '+targets.join(', '):'')};
document.getElementById('save').onclick=()=>{const note=document.getElementById('note').value.trim(),required=targetCounts[kind]??0;if(!kind||actor===null||targets.length<required||kind==='note'&&!note){status.textContent='Заполни действие, игрока, цели и текст заметки при необходимости';return}const event={kind,actor,targets:[...targets],phase:document.getElementById('phase').value,note,recorded_at:new Date().toISOString()};const div=document.createElement('div');div.textContent=event.phase+' · '+event.kind+' · №'+event.actor+(event.targets.length?' → '+event.targets.join(','):'')+(note?' · '+note:'');log.prepend(div);status.textContent='Демонстрационная запись добавлена локально. Серверное сохранение пока не подключено.';document.getElementById('note').value='';kind=null;actor=null;targets=[];render()};
render();
</script></body></html>
